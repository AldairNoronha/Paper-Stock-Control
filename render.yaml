services:
  - type: web
    name: paper-stock-control-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://aldairnoronha.github.io
      - key: SUPABASE_STORAGE_BUCKET
        value: label-images
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
